name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check public skill structure
        run: >-
          python -c "from pathlib import Path;
          text=Path('SKILL.md').read_text(encoding='utf-8');
          assert text.startswith('---\nname: competitor-content-synthesis\ndescription: ');
          assert '\n---\n' in text[4:];
          assert '[' + 'TO' + 'DO' not in text;
          assert Path('agents/openai.yaml').is_file();
          assert Path('references/input-contract.md').is_file();
          assert Path('scripts/normalize_content_pool.py').is_file()"
